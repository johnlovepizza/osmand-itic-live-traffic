services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: itic-postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: thailand
    ports:
      - "5432:5432"
    volumes:
      - itic_postgis_data:/var/lib/postgresql/data

volumes:
  itic_postgis_data:
